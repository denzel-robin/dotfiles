# greetd: shows the rice login screen on tty1.
[terminal]
vt = 1

[default_session]
# The greeter user's home is "/", so give Hyprland/Quickshell a writable cache
command = "env XDG_CACHE_HOME=/var/cache/rice-greeter XDG_STATE_HOME=/var/cache/rice-greeter/state XDG_DATA_HOME=/var/cache/rice-greeter/data Hyprland --config /etc/greetd/hyprland.lua"
user = "greeter"
