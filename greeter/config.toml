# greetd: shows the rice login screen on tty1.
[terminal]
vt = 1

[default_session]
# Hyprland directly (not start-hyprland): greetd must wait until this Hyprland has fully
# released the screen before starting your desktop, and start-hyprland's watchdog exits
# too early for that (your desktop then couldn't get the display and the login looped).
# The text console is blanked so nothing shows between login screen and desktop.
# The greeter user's home is "/", so Hyprland/Quickshell get a writable cache.
command = "sh -c 'export TERM=linux; clear; setterm --cursor off; exec env XDG_CACHE_HOME=/var/cache/rice-greeter XDG_STATE_HOME=/var/cache/rice-greeter/state XDG_DATA_HOME=/var/cache/rice-greeter/data Hyprland --config /etc/greetd/hyprland.lua >/dev/null 2>&1'"
user = "greeter"
