# Colours from the wallpaper (generated by matugen)
include colors.conf

font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

disable_ligatures always

enable_audio_bell no

cursor_shape block

# Let Hyprland tile new windows instead of restoring a maximized state.
remember_window_size no

# Breathing room + see-through background (Hyprland blurs what's behind)
window_padding_width 10 16
background_opacity   0.82
