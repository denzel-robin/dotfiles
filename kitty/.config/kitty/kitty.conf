# Colours from the wallpaper (generated by matugen)
include colors.conf

font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

disable_ligatures always

enable_audio_bell no

cursor_shape block

# Let Hyprland tile new windows instead of restoring a maximized state.
remember_window_size no

# Breathing room + see-through background (Hyprland blurs what's behind)
window_padding_width 10 16
background_opacity   0.72

# Smooth cursor trail when the cursor jumps (typing, moving around in nvim)
cursor_trail                 3
cursor_trail_decay           0.1 0.35
cursor_trail_start_threshold 2

# Snappier on the 144 Hz screen: redraw within ~one frame, react to input sooner
repaint_delay   6
input_delay     1
sync_to_monitor yes
