# No idle timers: the screen never locks or turns off by itself.
# hypridle still handles locking when the laptop goes to sleep and `loginctl lock-session`.
general {
    lock_cmd = qs ipc call rice lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    inhibit_sleep = 3   # don't suspend until the lock screen is actually up
}
