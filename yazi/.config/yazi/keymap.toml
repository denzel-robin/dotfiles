# Extra shortcuts on top of Yazi's defaults (press `~` inside Yazi for the full list).

[mgr]
prepend_keymap = [
    { on = [ "g", "p" ], run = "cd ~/Pictures",            desc = "Go to Pictures" },
    { on = [ "g", "w" ], run = "cd ~/Pictures/Wallpapers", desc = "Go to Wallpapers" },
    { on = [ "g", "D" ], run = "cd ~/dotfiles",            desc = "Go to dotfiles" },
    { on = [ "g", "G" ], run = "cd ~/Github",              desc = "Go to Github" },
    { on = [ "g", "i" ], run = "cd ~/College",             desc = "Go to college folder" },
    { on = [ "g", "t" ], run = "cd ~/.local/share/Trash/files", desc = "Go to Trash (Enter restores)" },
]
