# Yazi file manager. Colours come from the wallpaper (theme.toml, generated by matugen).

[mgr]
ratio          = [1, 3, 4]   # parent | current | preview
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false        # toggle with `.`
show_symlink   = true
scrolloff      = 5
linemode       = "size"

[preview]
wrap         = "no"
max_width    = 1200
max_height   = 1200
image_filter = "lanczos3"
image_quality = 85

# ── What Enter opens files with (O shows the other choices) ──
# Yazi's defaults go through xdg-open, which depends on system-wide defaults;
# these explicit openers make it predictable.

[opener]
edit      = [ { run = "nvim %s",         desc = "Edit in nvim",     block = true } ]
image     = [ { run = "imv %s",          desc = "View image",       orphan = true } ]
wallpaper = [ { run = "rice-wall %s1",   desc = "Set as wallpaper", orphan = true } ]
browser   = [ { run = "zen-browser %s",  desc = "Open in Zen",      orphan = true } ]
play      = [ { run = "mpv %s",          desc = "Play in mpv",      orphan = true } ]
office    = [ { run = "libreoffice %s",  desc = "LibreOffice",      orphan = true } ]
archiver  = [ { run = "file-roller %s1", desc = "File Roller",      orphan = true } ]
restore   = [ { run = "rice-trash restore %s", desc = "Restore to original place" } ]
purge     = [ { run = "rice-trash delete %s",  desc = "Delete forever" } ]

[open]
prepend_rules = [
    # Inside the trash: Enter restores; O also offers delete-forever or just viewing it
    { url = "**/.local/share/Trash/files/*", use = [ "restore", "purge", "edit", "open" ] },
    { mime = "text/*",          use = [ "edit", "reveal" ] },
    { mime = "inode/empty",     use = [ "edit" ] },
    { mime = "application/{json,ndjson,javascript,xml,toml,yaml,x-shellscript,x-subrip,sql}", use = [ "edit" ] },
    { url  = "*.{log,txt,md,conf,ini,cfg,toml,yaml,yml,json,csv,env,lua,qml,fish,sh,bash,py,js,ts,rs,go,c,h,cpp,java,html,css}", use = [ "edit" ] },
    { mime = "image/*",         use = [ "image", "wallpaper", "browser" ] },
    { mime = "{audio,video}/*", use = [ "play", "reveal" ] },
    { mime = "application/pdf", use = [ "browser", "office" ] },
    { mime = "application/{msword,rtf,vnd.openxmlformats-officedocument.*,vnd.oasis.opendocument.*,vnd.ms-*}", use = [ "office" ] },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "archiver" ] },
]
