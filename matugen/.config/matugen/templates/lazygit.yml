# Generated by matugen from the wallpaper (rice-wall). Edit the template in
# ~/dotfiles/matugen/.config/matugen/templates/lazygit.yml, not this file.
gui:
  nerdFontsVersion: "3"
  border: rounded
  showRandomTip: false
  showCommandLog: false
  theme:
    activeBorderColor:
      - "{{colors.primary.default.hex}}"
      - bold
    inactiveBorderColor:
      - "{{colors.outline_variant.default.hex}}"
    searchingActiveBorderColor:
      - "{{colors.tertiary.default.hex}}"
      - bold
    optionsTextColor:
      - "{{colors.primary.default.hex}}"
    selectedLineBgColor:
      - "{{colors.primary_container.default.hex}}"
    inactiveViewSelectedLineBgColor:
      - "{{colors.surface_container_high.default.hex}}"
    cherryPickedCommitFgColor:
      - "{{colors.on_tertiary_container.default.hex}}"
    cherryPickedCommitBgColor:
      - "{{colors.tertiary_container.default.hex}}"
    markedBaseCommitFgColor:
      - "{{colors.on_secondary_container.default.hex}}"
    markedBaseCommitBgColor:
      - "{{colors.secondary_container.default.hex}}"
    unstagedChangesColor:
      - "{{colors.red.default.hex}}"
    defaultFgColor:
      - "{{colors.on_surface.default.hex}}"
  authorColors:
    "*": "{{colors.secondary.default.hex}}"
git:
  paging:
    colorArg: always
