# Generated by matugen from the wallpaper. Your old prompt's layout, as coloured text (no blocks).
# Edit the template in ~/dotfiles/matugen.
format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$docker_context\
$time\
$character"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:{{colors.primary.default.hex}}"
style_root = "fg:{{colors.error.default.hex}} bold"
format = '[ ]($style)'
disabled = false 

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "fg:{{colors.primary.default.hex}}"
disabled = true # Disabled by default

[directory]
style = "fg:{{colors.secondary.default.hex}} bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:{{colors.secondary.default.hex}}"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'



[git_branch]
symbol = ""
style = "fg:{{colors.tertiary.default.hex}}"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:{{colors.tertiary.default.hex}}"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "fg:{{colors.primary.default.hex}}"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:{{colors.outline.default.hex}}"
format = '[  $time ]($style)'

[character]
success_symbol = "[❯]({{colors.primary.default.hex}})"
error_symbol = "[❯]({{colors.error.default.hex}})"
